  <header class="site-header" role="banner">
    <a href="../../index.html#blog" class="post-header__back" aria-label="Back to profile page">&larr; Back to profile</a>
  </header>
  <main class="site-main" role="main">
    <article class="post-content" aria-labelledby="post-title">
      <h1 id="post-title">Post Title Goes Here</h1>
      <time class="blog__date" datetime="YYYY-MM-DD">Month DD, YYYY</time>
      <div class="post-content__body">
        <!--
          TEMPLATE INSTRUCTIONS:
          1. Duplicate this file into blog/posts/ with the naming format: YYYY-MM-DD-your-post-slug.html
          2. Update the <title> tag in <head> with your post title
          3. Replace "Post Title Goes Here" in the <h1> with your actual post title
          4. Update the <time> element: set datetime="YYYY-MM-DD" and display text to "Month DD, YYYY"
          5. Write your post content below using semantic HTML (paragraphs, headings, lists, code blocks, etc.)
          6. Add a matching entry to the blog section in ../index.html
          7. Delete these instructions when done
        -->
        <p>Your blog post content goes here. Use semantic HTML elements to structure your writing.</p>
        <p>You can use headings (<code>&lt;h2&gt;</code>, <code>&lt;h3&gt;</code>), paragraphs, lists, code blocks, images, and links as needed.</p>
      </div>
    </article>
  </main>
